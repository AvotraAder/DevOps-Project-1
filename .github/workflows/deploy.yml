name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Exécution des tests unitaires
        run: |
          PYTHONPATH=src pytest

  deploy:
    needs: test
    runs-on: self-hosted   # Exécution directe sur ta VM Debian !
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build local et Lancement du conteneur
        run: |
          docker build -t devops-api:latest .
          docker stop devops-api || true
          docker rm devops-api || true
          docker run -d --name devops-api -p 8000:8000 devops-api:latest
